name: Temporary CRD - DEBUG - 3

on:
  workflow_dispatch:
    inputs:
      authcode:
        description: "Chrome Remote Desktop authorization code"
        required: true
        type: string

      pincode:
        description: "6-digit Chrome Remote Desktop PIN"
        required: true
        type: string

jobs:
  remote-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 01 - Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. RUNNER DIAGNOSTICS
      # ============================================================

      - name: 02 - Runner diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "WINDOWS RUNNER"
          Write-Host "=========================================="

          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List

          Write-Host ""
          Write-Host "Runner diagnostics: OK"

      # ============================================================
      # 3. VALIDATE INPUTS
      # ============================================================

      - name: 03 - Validate CRD inputs
        shell: powershell
        env:
          CRD_AUTH_CODE: ${{ github.event.inputs.authcode }}
          CRD_PIN: ${{ github.event.inputs.pincode }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "VALIDATING CRD INPUTS"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:CRD_AUTH_CODE)) {
              throw "CRD authorization code is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:CRD_PIN)) {
              throw "CRD PIN is empty."
          }

          if ($env:CRD_PIN -notmatch '^\d{6}$') {
              throw "CRD PIN must contain exactly 6 digits."
          }

          Write-Host "Authorization code: PRESENT"
          Write-Host "PIN: PRESENT"
          Write-Host "PIN format: VALID"

          # Never print credentials.

      # ============================================================
      # 4. CHECK LOCAL MSI
      # ============================================================

      - name: 04 - Verify local CRD installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CHECKING LOCAL CRD INSTALLER"
          Write-Host "=========================================="

          $installer = Join-Path `
            $env:GITHUB_WORKSPACE `
            "chromeremotedesktophost.msi"

          if (-not (Test-Path -LiteralPath $installer)) {
              throw "CRD MSI not found at: $installer"
          }

          $file = Get-Item -LiteralPath $installer

          Write-Host "Installer:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$([math]::Round($file.Length / 1MB, 2)) MB"

          if ($file.Length -lt 1MB) {
              throw "CRD MSI is suspiciously small."
          }

          Write-Host ""
          Write-Host "CRD MSI: FOUND"

          "CRD_INSTALLER=$installer" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 5. INSTALL CRD
      # ============================================================

      - name: 05 - Install Chrome Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $log = Join-Path $env:TEMP "crd-install.log"

          Write-Host "=========================================="
          Write-Host "INSTALLING CHROME REMOTE DESKTOP"
          Write-Host "=========================================="

          Write-Host "Installer:"
          Write-Host $env:CRD_INSTALLER

          Write-Host ""
          Write-Host "Starting MSI..."

          $start = Get-Date

          $msi = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$env:CRD_INSTALLER`""
              "/qn"
              "/norestart"
              "/L*v"
              "`"$log`""
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          $elapsed = (Get-Date) - $start

          Write-Host ""
          Write-Host "MSI finished."
          Write-Host "Elapsed: $([math]::Round($elapsed.TotalSeconds, 2)) seconds"
          Write-Host "Exit code: $($msi.ExitCode)"

          if ($msi.ExitCode -ne 0) {

              Write-Host ""
              Write-Host "========== MSI LOG =========="

              if (Test-Path $log) {
                  Get-Content $log -Tail 200
              }

              throw "CRD MSI installation failed."
          }

          Write-Host ""
          Write-Host "CRD installation: SUCCESS"

      # ============================================================
      # 6. FIND HOST EXECUTABLE
      # ============================================================

      - name: 06 - Find CRD host executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR CRD HOST"
          Write-Host "=========================================="

          $searchPaths = @(
            "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop",
            "$env:ProgramFiles\Google\Chrome Remote Desktop"
          )

          $crdHosts = @()

          foreach ($searchPath in $searchPaths) {

              Write-Host ""
              Write-Host "Searching:"
              Write-Host $searchPath

              if (Test-Path -LiteralPath $searchPath) {

                  $found = Get-ChildItem `
                    -LiteralPath $searchPath `
                    -Recurse `
                    -Filter "remoting_start_host.exe" `
                    -File `
                    -ErrorAction SilentlyContinue

                  if ($found) {
                      $crdHosts += $found
                  }
              }
          }

          if ($crdHosts.Count -eq 0) {
              throw "remoting_start_host.exe was not found."
          }

          Write-Host ""
          Write-Host "Found CRD host executable(s):"

          foreach ($crdHost in $crdHosts) {
              Write-Host $crdHost.FullName
          }

          $selectedCrdHost = $crdHosts[0].FullName

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $selectedCrdHost

          "CRD_HOST_EXE=$selectedCrdHost" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      # ============================================================
      # 7. SHOW CRD VERSION
      # ============================================================

      - name: 07 - CRD host diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CRD HOST DIAGNOSTICS"
          Write-Host "=========================================="

          if (-not (Test-Path -LiteralPath $env:CRD_HOST_EXE)) {
              throw "CRD host executable does not exist."
          }

          $file = Get-Item -LiteralPath $env:CRD_HOST_EXE

          Write-Host "Path:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "File size:"
          Write-Host "$([math]::Round($file.Length / 1MB, 2)) MB"

          Write-Host ""
          Write-Host "File version:"
          Write-Host $file.VersionInfo.FileVersion

          Write-Host ""
          Write-Host "Product version:"
          Write-Host $file.VersionInfo.ProductVersion

      # ============================================================
      # 8. REGISTER CRD HOST
      # ============================================================

      - name: 08 - Register CRD host
        shell: powershell
        env:
          CRD_AUTH_CODE: ${{ github.event.inputs.authcode }}
          CRD_PIN: ${{ github.event.inputs.pincode }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CRD HOST REGISTRATION"
          Write-Host "=========================================="

          if (-not (Test-Path -LiteralPath $env:CRD_HOST_EXE)) {
              throw "CRD host executable not found."
          }

          Write-Host "Executable:"
          Write-Host $env:CRD_HOST_EXE

          Write-Host ""
          Write-Host "Computer name:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Authorization code: PRESENT"
          Write-Host "PIN: PRESENT"

          Write-Host ""
          Write-Host "Starting CRD registration..."

          $crdArguments = @(
            "--code=$env:CRD_AUTH_CODE"
            "--redirect-url=https://remotedesktop.google.com/_/oauthredirect"
            "--name=$env:COMPUTERNAME"
            "--pin=$env:CRD_PIN"
          )

          $start = Get-Date

          $registration = Start-Process `
            -FilePath $env:CRD_HOST_EXE `
            -ArgumentList $crdArguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          $elapsed = (Get-Date) - $start

          Write-Host ""
          Write-Host "CRD registration process finished."
          Write-Host "Elapsed: $([math]::Round($elapsed.TotalSeconds, 2)) seconds"
          Write-Host "Exit code: $($registration.ExitCode)"

          if ($registration.ExitCode -ne 0) {
              throw "CRD registration failed with exit code $($registration.ExitCode)."
          }

          Write-Host ""
          Write-Host "CRD registration: SUCCESS"

      # ============================================================
      # 9. VERIFY SERVICE
      # ============================================================

      - name: 09 - Verify CRD service
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CRD SERVICE VERIFICATION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Chrome Remote Desktop services:"

          $services = Get-Service |
            Where-Object {
              $_.Name -match "chromoting|remoting" -or
              $_.DisplayName -match "Chrome Remote Desktop"
            }

          if ($services) {
              $services |
                Select-Object Name, Status, StartType, DisplayName |
                Format-Table -AutoSize
          }
          else {
              Write-Warning "No Chrome Remote Desktop service was found."
          }

          Write-Host ""
          Write-Host "CRD processes:"

          $processes = Get-Process |
            Where-Object {
              $_.ProcessName -match "chromoting|remoting"
            }

          if ($processes) {
              $processes |
                Select-Object Id, ProcessName |
                Format-Table -AutoSize
          }
          else {
              Write-Warning "No CRD-related process was found."
          }

      # ============================================================
      # 10. FINAL STATUS
      # ============================================================

      - name: 10 - Ready
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       TEMPORARY CRD RUNNER READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "GitHub Run: $env:GITHUB_RUN_ID"
          Write-Host ""
          Write-Host "The runner will remain alive until"
          Write-Host "the workflow is cancelled or times out."
          Write-Host ""
          Write-Host "=========================================="

      # ============================================================
      # 11. KEEP ALIVE
      # ============================================================

      - name: 11 - Keep alive
        shell: powershell
        run: |
          Write-Host "Keep-alive started."

          while ($true) {

              $crdProcesses = Get-Process |
                Where-Object {
                  $_.ProcessName -match "chromoting|remoting"
                }

              if ($crdProcesses) {
                  Write-Host "[$(Get-Date)] CRD process detected."
              }
              else {
                  Write-Warning "[$(Get-Date)] No CRD process detected."
              }

              Start-Sleep -Seconds 60
          }
