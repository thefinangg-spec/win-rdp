name: Temporary CRD - DEBUG -2

on:
  workflow_dispatch:
    inputs:
      authcode:
        description: "Chrome Remote Desktop authorization code"
        required: true
        type: string

      pincode:
        description: "6-digit Chrome Remote Desktop PIN"
        required: true
        type: string

jobs:
  remote-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. BASIC RUNNER TEST
      # ============================================================

      - name: 01 - Test Windows runner
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "WINDOWS RUNNER TEST"
          Write-Host "=========================================="

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List

          Write-Host ""
          Write-Host "Runner test: SUCCESS"

      # ============================================================
      # 2. VALIDATE INPUTS
      # ============================================================

      - name: 02 - Validate CRD inputs
        shell: powershell
        env:
          CRD_AUTH_CODE: ${{ github.event.inputs.authcode }}
          CRD_PIN: ${{ github.event.inputs.pincode }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "CRD INPUT VALIDATION"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:CRD_AUTH_CODE)) {
              throw "CRD authorization code is empty."
          }

          if ([string]::IsNullOrWhiteSpace($env:CRD_PIN)) {
              throw "CRD PIN is empty."
          }

          if ($env:CRD_PIN -notmatch '^\d{6}$') {
              throw "CRD PIN must contain exactly 6 digits."
          }

          Write-Host "Authorization code: PRESENT"
          Write-Host "PIN: PRESENT"
          Write-Host "PIN format: VALID"

          # NEVER print the actual auth code or PIN.

      # ============================================================
      # 3. DOWNLOAD CRD
      # ============================================================

      - name: 03 - Download Chrome Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
          $installer = "$env:TEMP\chromeremotedesktophost.msi"

          Write-Host "=========================================="
          Write-Host "DOWNLOADING CHROME REMOTE DESKTOP"
          Write-Host "=========================================="

          Write-Host "Downloading..."

          $start = Get-Date

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          $elapsed = (Get-Date) - $start

          if (-not (Test-Path $installer)) {
              throw "CRD installer was not downloaded."
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "Download complete."
          Write-Host "Time: $([math]::Round($elapsed.TotalSeconds, 2)) seconds"
          Write-Host "Size: $($file.Length) bytes"

          if ($file.Length -lt 100000) {
              throw "Downloaded installer is suspiciously small."
          }

          Write-Host "Download test: SUCCESS"

      # ============================================================
      # 4. INSTALL CRD
      # ============================================================

      - name: 04 - Install Chrome Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\chromeremotedesktophost.msi"
          $log = "$env:TEMP\crd-install.log"

          Write-Host "=========================================="
          Write-Host "INSTALLING CRD"
          Write-Host "=========================================="

          Write-Host "Starting MSI..."

          $start = Get-Date

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i"
              "`"$installer`""
              "/qn"
              "/norestart"
              "/L*v"
              "`"$log`""
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          $elapsed = (Get-Date) - $start

          Write-Host ""
          Write-Host "MSI finished."
          Write-Host "Time: $([math]::Round($elapsed.TotalSeconds, 2)) seconds"
          Write-Host "Exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {

              Write-Host ""
              Write-Host "========== MSI ERROR LOG =========="

              if (Test-Path $log) {
                  Get-Content $log -Tail 150
              }

              throw "CRD installation failed."
          }

          Write-Host "CRD installation: SUCCESS"

      # ============================================================
      # 5. FIND CRD HOST EXECUTABLE
      # ============================================================

      - name: 05 - Find CRD host executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "SEARCHING FOR CRD HOST"
          Write-Host "=========================================="

          $searchPaths = @(
            "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop",
            "$env:ProgramFiles\Google\Chrome Remote Desktop"
          )

          $hosts = @()

          foreach ($path in $searchPaths) {

              Write-Host ""
              Write-Host "Searching:"
              Write-Host $path

              if (Test-Path $path) {

                  $found = Get-ChildItem `
                    -Path $path `
                    -Recurse `
                    -Filter "remoting_start_host.exe" `
                    -ErrorAction SilentlyContinue

                  if ($found) {
                      $hosts += $found
                  }
              }
          }

          if ($hosts.Count -eq 0) {
              throw "remoting_start_host.exe was not found."
          }

          Write-Host ""
          Write-Host "Found CRD host executable:"

          foreach ($host in $hosts) {
              Write-Host $host.FullName
          }

          $hostPath = $hosts[0].FullName

          "CRD_HOST_EXE=$hostPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ""
          Write-Host "Selected:"
          Write-Host $hostPath

      # ============================================================
      # 6. REGISTER CRD
      # ============================================================

      - name: 06 - Register Chrome Remote Desktop
        shell: powershell
        env:
          CRD_AUTH_CODE: ${{ github.event.inputs.authcode }}
          CRD_PIN: ${{ github.event.inputs.pincode }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "REGISTERING CHROME REMOTE DESKTOP"
          Write-Host "=========================================="

          if (-not (Test-Path $env:CRD_HOST_EXE)) {
              throw "CRD host executable does not exist."
          }

          Write-Host "Executable:"
          Write-Host $env:CRD_HOST_EXE

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Authorization code: PRESENT"
          Write-Host "PIN: PRESENT"

          Write-Host ""
          Write-Host "Starting registration..."

          $arguments = @(
            "--code=$env:CRD_AUTH_CODE"
            "--redirect-url=https://remotedesktop.google.com/_/oauthredirect"
            "--name=$env:COMPUTERNAME"
            "--pin=$env:CRD_PIN"
          )

          $process = Start-Process `
            -FilePath $env:CRD_HOST_EXE `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "Registration process finished."
          Write-Host "Exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              throw "CRD registration failed with exit code $($process.ExitCode)."
          }

          Write-Host ""
          Write-Host "CRD registration: SUCCESS"

      # ============================================================
      # 7. VERIFY
      # ============================================================

      - name: 07 - Verify CRD
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CRD VERIFICATION"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "CRD processes:"

          Get-Process |
            Where-Object {
              $_.ProcessName -match "chromoting|remoting"
            } |
            Select-Object Id, ProcessName |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "CRD services:"

          Get-Service |
            Where-Object {
              $_.Name -match "chromoting|remoting" -or
              $_.DisplayName -match "Chrome Remote Desktop"
            } |
            Select-Object Name, Status, StartType, DisplayName |
            Format-Table -AutoSize

      # ============================================================
      # 8. KEEP ALIVE
      # ============================================================

      - name: 08 - Keep runner alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "CRD SHOULD NOW BE ONLINE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Computer name: $env:COMPUTERNAME"
          Write-Host "GitHub Run ID: $env:GITHUB_RUN_ID"

          Write-Host ""
          Write-Host "Keep-alive started."

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date)] Runner alive."

              $crd = Get-Process |
                Where-Object {
                  $_.ProcessName -match "chromoting|remoting"
                }

              if ($crd) {
                  Write-Host "CRD process detected."
              }
              else {
                  Write-Warning "No CRD process detected."
              }

              Start-Sleep -Seconds 60
          }
